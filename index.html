  <script>
    var langButton = document.querySelector(".lang");

    function labelLangButton(lang) {
      langButton.setAttribute("aria-label", lang === "el" ? "Ελληνικά" : "English");
    }

    labelLangButton(document.documentElement.lang);

    langButton.addEventListener("click", function () {
      var next = document.documentElement.lang === "el" ? "en" : "el";
      document.documentElement.lang = next;
      labelLangButton(next);
      try { localStorage.setItem("lang", next); } catch (e) {}
    });
  </script>
